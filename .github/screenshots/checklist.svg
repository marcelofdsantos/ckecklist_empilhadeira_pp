  <text x="334" y="279" font-family="Arial, sans-serif" font-size="10" fill="#1976D2">Hora</text>
  <text x="334" y="292" font-family="Arial, sans-serif" font-size="11" fill="#212529">07:30:00</text>
  <rect x="552" y="266" width="244" height="34" rx="4" fill="white" stroke="#CED4DA" stroke-width="1.5"/>
  <text x="562" y="279" font-family="Arial, sans-serif" font-size="10" fill="#1976D2">Turno</text>
  <text x="562" y="292" font-family="Arial, sans-serif" font-size="11" fill="#212529">Turno A - Manhã</text>
