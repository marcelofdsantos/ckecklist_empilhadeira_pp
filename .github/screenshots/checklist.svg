  <text x="100" y="528" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E65100">4. Itens Impeditivos ⚠️</text>
  <text x="100" y="544" font-family="Arial, sans-serif" font-size="11" fill="#F57C00">🚫 Item não conforme BLOQUEIA a empilhadeira</text>
  <line x1="96" y1="554" x2="808" y2="554" stroke="#FFE0B2" stroke-width="1"/>
  <!-- Impeditivo item 1 -->
  <rect x="96" y="558" width="710" height="26" rx="4" fill="#FFF3E0"/>
  <text x="100" y="575" font-family="Arial, sans-serif" font-size="12" fill="#212529">1. Direção</text>
  <circle cx="680" cy="571" r="6" fill="white" stroke="#1976D2" stroke-width="2"/>
  <circle cx="680" cy="571" r="3" fill="#1976D2"/>
  <text x="692" y="575" font-family="Arial, sans-serif" font-size="11" fill="#212529">OK</text>
  <circle cx="734" cy="571" r="6" fill="white" stroke="#CED4DA" stroke-width="1.5"/>
  <text x="746" y="575" font-family="Arial, sans-serif" font-size="11" fill="#6C757D">Não Conforme</text>
  <line x1="96" y1="588" x2="808" y2="588" stroke="#FFE0B2" stroke-width="1"/>
  <!-- Impeditivo item 2 -->
  <text x="100" y="605" font-family="Arial, sans-serif" font-size="12" fill="#212529">2. Cinto de segurança</text>
  <circle cx="680" cy="601" r="6" fill="white" stroke="#1976D2" stroke-width="2"/>
  <circle cx="680" cy="601" r="3" fill="#1976D2"/>
  <text x="692" y="605" font-family="Arial, sans-serif" font-size="11" fill="#212529">OK</text>
  <circle cx="734" cy="601" r="6" fill="white" stroke="#CED4DA" stroke-width="1.5"/>
  <text x="746" y="605" font-family="Arial, sans-serif" font-size="11" fill="#6C757D">Não Conforme</text>

  <!-- Save button -->
