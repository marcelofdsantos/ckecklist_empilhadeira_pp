  <text x="112" y="195" font-family="Arial, sans-serif" font-size="12" fill="#212529">YALE GP030 - Elétrica (3000t)</text>
  <text x="774" y="195" font-family="Arial, sans-serif" font-size="12" fill="#6C757D" text-anchor="end">▼</text>

