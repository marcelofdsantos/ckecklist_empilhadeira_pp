  <text x="746" y="450" font-family="Arial, sans-serif" font-size="11" fill="#6C757D">Não Conforme</text>
  <line x1="96" y1="460" x2="808" y2="460" stroke="#F1F3F5" stroke-width="1"/>
  <!-- Item 3 -->
  <text x="100" y="477" font-family="Arial, sans-serif" font-size="12" fill="#212529">3. Garfos</text>
  <circle cx="680" cy="474" r="6" fill="white" stroke="#1976D2" stroke-width="2"/>
  <circle cx="680" cy="474" r="3" fill="#1976D2"/>
  <text x="692" y="478" font-family="Arial, sans-serif" font-size="11" fill="#212529">OK</text>
  <circle cx="734" cy="474" r="6" fill="white" stroke="#CED4DA" stroke-width="1.5"/>
  <text x="746" y="478" font-family="Arial, sans-serif" font-size="11" fill="#6C757D">Não Conforme</text>

  <!-- Section 4: Impeditivos (orange border) -->
