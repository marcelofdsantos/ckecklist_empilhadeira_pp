<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="#F8F9FA"/>

  <!-- Browser chrome -->
  <rect x="40" y="10" width="820" height="660" rx="12" fill="white" filter="url(#shadow2)"/>
  <rect x="40" y="10" width="820" height="44" rx="12" fill="#F1F3F5"/>
  <rect x="40" y="42" width="820" height="12" fill="#F1F3F5"/>
  <circle cx="68" cy="32" r="6" fill="#FF5F57"/>
  <circle cx="88" cy="32" r="6" fill="#FFBD2E"/>
  <circle cx="108" cy="32" r="6" fill="#28C840"/>
  <rect x="200" y="21" width="380" height="22" rx="11" fill="white"/>
  <text x="390" y="36" font-family="Arial, sans-serif" font-size="12" fill="#6C757D" text-anchor="middle">localhost/checklist</text>

  <!-- Page content -->
  <rect x="40" y="54" width="820" height="616" fill="#F8F9FA"/>

