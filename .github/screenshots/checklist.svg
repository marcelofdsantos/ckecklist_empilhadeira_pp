  <circle cx="680" cy="418" r="3" fill="#1976D2"/>
  <text x="692" y="422" font-family="Arial, sans-serif" font-size="11" fill="#212529">OK</text>
  <circle cx="734" cy="418" r="6" fill="white" stroke="#CED4DA" stroke-width="1.5"/>
  <text x="746" y="422" font-family="Arial, sans-serif" font-size="11" fill="#6C757D">Não Conforme</text>
  <line x1="96" y1="432" x2="808" y2="432" stroke="#F1F3F5" stroke-width="1"/>
  <!-- Item 2 -->
  <text x="100" y="449" font-family="Arial, sans-serif" font-size="12" fill="#212529">2. Pneus dianteiro</text>
  <circle cx="680" cy="446" r="6" fill="white" stroke="#1976D2" stroke-width="2"/>
  <circle cx="680" cy="446" r="3" fill="#1976D2"/>
  <text x="692" y="450" font-family="Arial, sans-serif" font-size="11" fill="#212529">OK</text>
