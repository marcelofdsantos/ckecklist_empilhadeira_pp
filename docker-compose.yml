services:

  postgres:
    image: postgres:16-alpine
    container_name: checklist-db
    environment:
      POSTGRES_DB: checklist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checklist_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checklist-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/checklist_db
      DB_USERNAME: postgres
      DB_PASSWORD: admin
      JWT_SECRET: ${JWT_SECRET:-chave-secreta-desenvolvimento-local-checklist-2024-segura}
      JWT_EXPIRATION: "86400000"
      CORS_ORIGINS: "http://localhost,http://localhost:80"
      DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: dev
      SWAGGER_ENABLED: "true"
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:-admin123}
      SEED_DEFAULT_SENHA: ${SEED_DEFAULT_SENHA:-senha123}
      # JVM para dev (sem restrição de RAM)
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: checklist-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
