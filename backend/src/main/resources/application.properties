# ==================================================
# SERVER
# ==================================================
server.port=${PORT:8080}
server.servlet.context-path=/api
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-binding-errors=never
server.error.include-stacktrace=never
# Compressão de resposta HTTP — reduz tráfego de rede
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024
# Limite de payload
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
# Threads do Tomcat — reduzir para economizar memória
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# ==================================================
# SPRING PROFILE
# ==================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==================================================
# DATABASE
# ==================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/checklist_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — otimizado para 512MB RAM (Railway free tier)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=ChecklistHikariPool

# ==================================================
# JPA / HIBERNATE
# ==================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Desabilita second-level cache para economizar heap
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
# Lazy loading explícito
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ==================================================
# JSON / TIMEZONE
# ==================================================
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=false

# ==================================================
# JWT
# ==================================================
jwt.secret=${JWT_SECRET:minha-chave-secreta-muito-segura-para-desenvolvimento-local-checklist-2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==================================================
# CORS
# ==================================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}

# ==================================================
# SEED DATA
# ==================================================
seed.admin.senha=${SEED_ADMIN_SENHA:admin123}
seed.default.senha=${SEED_DEFAULT_SENHA:senha123}

# ==================================================
# LOGGING — mínimo em produção para não gastar heap
# ==================================================
logging.level.root=WARN
logging.level.com.deicmar=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ==================================================
# ACTUATOR — health check para Railway
# ==================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=db
management.info.env.enabled=true
info.app.name=Checklist de Empilhadeiras
info.app.version=1.0.0

# ==================================================
# SPRINGDOC / SWAGGER (OpenAPI)
# ==================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
