# ==================================================
# PROFILE: DESENVOLVIMENTO LOCAL
# Usado por: mvn spring-boot:run (IntelliJ, terminal)
# ==================================================

# Banco local
spring.datasource.url=jdbc:postgresql://localhost:5432/checklist_db
spring.datasource.username=postgres
spring.datasource.password=admin

# Em dev, recria o schema limpo para evitar constraints desatualizadas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT com valor fixo para dev - nao precisa de env var
jwt.secret=chave-desenvolvimento-local-nao-usar-em-producao-checklist-2024
jwt.expiration=86400000

# CORS liberado para dev
cors.allowed-origins=http://localhost:4200,http://localhost:8080,http://localhost

# Senhas de seed para dev
seed.admin.senha=admin123
seed.default.senha=senha123

# Swagger habilitado em dev
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Logs verbosos em dev
logging.level.root=INFO
logging.level.com.deicmar=DEBUG
logging.level.org.springframework.security=WARN
