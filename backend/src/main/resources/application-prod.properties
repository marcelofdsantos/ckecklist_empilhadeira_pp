# ==================================================
# PROFILE: PRODUÇÃO — Railway
# Ativado com: SPRING_PROFILES_ACTIVE=prod
# ==================================================

# Banco
# Railway injeta DATABASE_URL no formato: postgres://user:pass@host:port/db
# O DatabaseConfig.java converte para jdbc:postgresql:// automaticamente
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/checklist_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PRIMEIRO DEPLOY: DDL_AUTO=update — cria as tabelas no banco vazio
# DEPOIS: mude para DDL_AUTO=validate no painel Railway
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Pool reduzido para 512 MB Railway
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# JWT — obrigatório, sem fallback
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — URL do frontend no Railway
cors.allowed-origins=${CORS_ORIGINS:http://localhost}

# Swagger desabilitado em prod
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# Sem detalhes de erro
server.error.include-message=never
server.error.include-binding-errors=never

# Logs mínimos
logging.level.root=WARN
logging.level.com.deicmar=INFO
